<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>길드 캐릭터 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
<style id="css">
:root{--blue:#2340ff;--bt:#2340ff;--soft:#e9ecff;--bg:#fff;--card:#fff;--ink:#0b0b10;--text:#4a4a55;--mute:#8d8d99;--line:#e6e6ec;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body[data-mode="on"]{--bt:#7d92ff;--soft:#161a3c;--bg:#0c0d12;--card:#12131a;--ink:#fff;--text:#b4b5c0;--mute:#7c7d8b;--line:#252631}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;transition:background .4s,color .4s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 60px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);transition:background .4s}
.brand{font-size:12px;font-weight:800;letter-spacing:.22em}.brand b{color:var(--bt)}
.sw{position:relative;width:108px;height:40px;border-radius:99px;border:1.5px solid var(--ink);background:var(--bg);font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--mute);flex:none}
.sw .l{position:absolute;top:50%;transform:translateY(-50%)}.sw .a{left:16px}.sw .b{right:18px}
.sw .k{position:absolute;top:3px;left:3px;width:54px;height:30px;border-radius:99px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .3s}
body[data-mode="on"] .sw .k{transform:translateX(46px)}
.guild{margin-top:44px}
.gh{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:10px}
.gh i{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--bt)}
.gname{flex:1;min-width:0;border:0;background:none;font-size:26px;font-weight:800;letter-spacing:-.03em;outline:none}
.gname:focus,.cname:focus{box-shadow:0 2px 0 var(--blue)}
.mini{border:1.5px solid var(--line);background:none;font-size:12px;font-weight:800;padding:6px 10px;color:var(--mute);white-space:nowrap}
.mini:hover{border-color:var(--blue);color:var(--bt)}
.cards{display:grid;gap:20px;margin-top:20px}
.card{border:1px solid var(--line);background:var(--card);transition:background .4s}
.ch{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);border-left:4px solid var(--blue)}
.cname{flex:1;min-width:0;border:0;background:none;font-size:18px;font-weight:800;outline:none}
.cb{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr)}
.photo{position:relative;aspect-ratio:4/5;background:linear-gradient(160deg,#9fe7ee,#c9c4f2 45%,#f6d3e4);overflow:hidden;cursor:pointer;border:0;display:block;width:100%}
body[data-mode="on"] .photo{background:linear-gradient(170deg,#7d8a4e,#a6a98a 50%,#4e4a3c)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.photo span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:800;color:rgba(255,255,255,.9);padding:10px}
.photo:hover::after{content:"사진 변경";position:absolute;left:0;right:0;bottom:0;padding:8px;background:var(--blue);color:#fff;font-size:12px;font-weight:800;text-align:center}
.pm{padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pt{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pl{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--bt)}
.copy{border:1.5px solid var(--blue);background:var(--blue);color:#fff;font-size:13px;font-weight:800;padding:8px 18px}
.copy.done{background:none;color:var(--bt);border-color:var(--bt)}
textarea{flex:1;min-height:180px;width:100%;resize:vertical;border:0;border-left:4px solid var(--blue);background:var(--soft);padding:14px 16px;font-size:14px;line-height:1.8;outline:none;transition:background .4s}
.add{display:block;width:100%;margin-top:14px;border:1.5px dashed var(--blue);background:none;color:var(--bt);font-weight:800;font-size:13px;padding:11px}
.add:hover{background:var(--soft)}
.addg{margin-top:44px;border-width:2px;padding:16px;font-size:14px}
.top{flex-wrap:wrap}.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}.tools .mini{color:var(--ink);border-color:var(--ink)}.tools .pri{background:var(--blue);border-color:var(--blue);color:#fff}#msg{font-size:12px;font-weight:700;color:var(--bt)}
@media(max-width:640px){.wrap{padding:0 14px 60px}.cb{grid-template-columns:1fr}.photo{aspect-ratio:1/1}.gname{font-size:22px}}
</style>
</head>
<body data-mode="off">
<div class="top">
  <div class="brand"><b>GUILD</b> CARDS</div>
  <div class="tools"><span id="msg"></span><button class="mini" id="bLoad">불러오기</button><button class="mini" id="bJson">JSON 저장</button><button class="mini pri" id="bHtml">HTML 내보내기</button></div>
  <button class="sw" id="sw" role="switch" aria-checked="false" aria-label="OFF / ON 전환">
    <span class="l a">OFF</span><span class="l b">ON</span><span class="k" id="k">OFF</span>
  </button>
</div>
<main class="wrap" id="root"></main>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="jsonIn" accept=".json,application/json" hidden>

<script type="text/plain" id="v-js">
(function(){
  var S=JSON.parse(document.getElementById('d').textContent);
  var m=S.mode==='on'?'on':'off';
  var root=document.getElementById('root');
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  function render(){
    document.body.setAttribute('data-mode',m);
    document.getElementById('sw').setAttribute('aria-checked',m==='on');
    document.getElementById('k').textContent=m.toUpperCase();
    root.innerHTML=S.guilds.map(function(g,gi){
      return '<section class="guild"><div class="gh"><i>GUILD '+String(gi+1).padStart(2,'0')+'</i><h2 class="gname">'+esc(g.name)+'</h2></div><div class="cards">'+
      g.chars.map(function(c){
        return '<article class="card"><div class="ch"><div class="cname">'+esc(c.name)+'</div></div><div class="cb"><div class="photo">'+(c.img?'<img src="'+esc(c.img)+'" alt="">':'<span>NO IMAGE</span>')+'</div>'+
        '<div class="pm"><div class="pt"><span class="pl">'+m.toUpperCase()+' 프롬프트</span><button class="copy">복사</button></div><div class="ptxt">'+esc(c[m])+'</div></div></div></article>';
      }).join('')+'</div></section>';
    }).join('');
  }
  document.getElementById('sw').onclick=function(){m=m==='on'?'off':'on';render()};
  root.addEventListener('click',function(e){
    var b=e.target.closest('.copy');if(!b)return;
    var t=b.closest('.pm').querySelector('.ptxt').textContent;
    var ok=function(){b.textContent='복사됨 ✓';b.classList.add('done');setTimeout(function(){b.textContent='복사';b.classList.remove('done')},1400)};
    var fb=function(){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(x){b.textContent='복사 실패'}document.body.removeChild(ta)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
  });
  render();
})();
</script>

<script>
(function(){
  var KEY='guild-cards-v1';
  var uid=function(){return Math.random().toString(36).slice(2,9)};
  var newChar=function(n){return {id:uid(),name:n||'새 캐릭터',img:'',off:'',on:''}};
  var S;
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!S||!S.guilds){
    S={mode:(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'on':'off',guilds:[
      {id:uid(),name:'첫 번째 길드',chars:[
        {id:uid(),name:'캐릭터 이름',img:'',off:'여기에 OFF 상태 프롬프트를 적으세요.',on:'여기에 ON 상태 프롬프트를 적으세요.'}]},
      {id:uid(),name:'두 번째 길드',chars:[newChar('캐릭터 이름')]}]};
  }
  var timer;
  function save(){clearTimeout(timer);timer=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},300)}
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var root=document.getElementById('root'),fileIn=document.getElementById('file'),pick=null;

  function find(gid,cid){var g=S.guilds.filter(function(x){return x.id===gid})[0];if(!g)return{};
    return{g:g,c:cid?g.chars.filter(function(x){return x.id===cid})[0]:null}}

  function render(){
    var m=S.mode;
    document.body.setAttribute('data-mode',m);
    var sw=document.getElementById('sw');sw.setAttribute('aria-checked',m==='on');
    document.getElementById('k').textContent=m.toUpperCase();
    root.innerHTML=S.guilds.map(function(g,gi){
      return '<section class="guild" data-g="'+g.id+'"><div class="gh"><i>GUILD '+String(gi+1).padStart(2,'0')+'</i>'+
        '<input class="gname" data-f="gname" value="'+esc(g.name)+'" placeholder="길드 이름">'+
        '<button class="mini" data-a="delg">길드 삭제</button></div><div class="cards">'+
        g.chars.map(function(c){
          return '<article class="card" data-c="'+c.id+'"><div class="ch"><input class="cname" data-f="cname" value="'+esc(c.name)+'" placeholder="이름">'+
            '<button class="mini" data-a="delc">삭제</button></div><div class="cb">'+
            '<button class="photo" data-a="img" aria-label="사진 넣기">'+(c.img?'<img src="'+c.img+'" alt="">':'<span>＋ 사진 넣기</span>')+'</button>'+
            '<div class="pm"><div class="pt"><span class="pl">'+m.toUpperCase()+' 프롬프트</span><button class="copy" data-a="copy">복사</button></div>'+
            '<textarea data-f="prompt" placeholder="'+m.toUpperCase()+' 상태에서 쓸 프롬프트를 붙여넣으세요">'+esc(c[m])+'</textarea></div></div></article>';
        }).join('')+'</div><button class="add" data-a="addc">＋ 캐릭터 추가</button></section>';
    }).join('')+'<button class="add addg" data-a="addg">＋ 길드 추가</button>';
  }

  document.getElementById('sw').onclick=function(){S.mode=S.mode==='on'?'off':'on';save();render()};

  root.addEventListener('input',function(e){
    var f=e.target.getAttribute('data-f');if(!f)return;
    var gs=e.target.closest('.guild'),cs=e.target.closest('.card');
    var r=find(gs.getAttribute('data-g'),cs&&cs.getAttribute('data-c'));
    if(f==='gname')r.g.name=e.target.value;
    else if(f==='cname')r.c.name=e.target.value;
    else if(f==='prompt')r.c[S.mode]=e.target.value;
    save();
  });

  function copyText(t,btn){
    var ok=function(){btn.textContent='복사됨 ✓';btn.classList.add('done');setTimeout(function(){btn.textContent='복사';btn.classList.remove('done')},1400)};
    var fb=function(){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');ok()}catch(e){btn.textContent='복사 실패'}document.body.removeChild(ta)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
  }

  root.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]');if(!b)return;
    var a=b.getAttribute('data-a'),gs=b.closest('.guild'),cs=b.closest('.card');
    var r=gs?find(gs.getAttribute('data-g'),cs&&cs.getAttribute('data-c')):{};
    if(a==='addg'){S.guilds.push({id:uid(),name:'새 길드',chars:[newChar()]})}
    else if(a==='delg'){if(!confirm('이 길드와 안의 캐릭터가 모두 삭제돼요. 계속할까요?'))return;S.guilds=S.guilds.filter(function(g){return g!==r.g})}
    else if(a==='addc'){r.g.chars.push(newChar())}
    else if(a==='delc'){if(!confirm('이 캐릭터를 삭제할까요?'))return;r.g.chars=r.g.chars.filter(function(c){return c!==r.c})}
    else if(a==='img'){pick=r;fileIn.value='';fileIn.click();return}
    else if(a==='copy'){copyText(cs.querySelector('textarea').value,b);return}
    save();render();
  });

  fileIn.onchange=function(){
    var f=fileIn.files[0];if(!f||!pick||!pick.c)return;
    var target=pick.c,rd=new FileReader();
    rd.onload=function(){var im=new Image();im.onload=function(){
      var s=Math.min(1,720/Math.max(im.width,im.height)),cv=document.createElement('canvas');
      cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      target.img=cv.toDataURL('image/jpeg',.82);save();render();
    };im.src=rd.result};
    rd.readAsDataURL(f);
  };

  var msg=document.getElementById('msg'),jsonIn=document.getElementById('jsonIn'),mt;
  function flash(t){msg.textContent=t;clearTimeout(mt);mt=setTimeout(function(){msg.textContent=''},2800)}
  async function saveFile(name,data){
    var d=null;
    try{if(window.claude&&claude.use)d=await claude.use('downloads')}catch(e){}
    if(d){
      try{await d.save({filename:name,data:data});flash('저장했어요')}
      catch(e){if(!e||e.code!=='declined')flash('저장 실패')}
      return;
    }
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;
    document.body.appendChild(a);a.click();a.remove();flash('저장했어요');
  }
  function clean(o){
    if(!o||!Array.isArray(o.guilds))return null;
    var t=function(v){return typeof v==='string'?v:''};
    return{mode:o.mode==='on'?'on':'off',guilds:o.guilds.map(function(g){
      return{id:uid(),name:t(g&&g.name),chars:(g&&Array.isArray(g.chars)?g.chars:[]).map(function(c){
        var im=t(c&&c.img);
        return{id:uid(),name:t(c&&c.name),img:/^data:image\/[a-z+.-]+;base64,[A-Za-z0-9+\/=]+$/.test(im)?im:'',off:t(c&&c.off),on:t(c&&c.on)};
      })};
    })};
  }
  document.getElementById('bJson').onclick=function(){saveFile('guild-cards.json',JSON.stringify({mode:S.mode,guilds:S.guilds},null,1))};
  document.getElementById('bLoad').onclick=function(){jsonIn.value='';jsonIn.click()};
  jsonIn.onchange=function(){
    var f=jsonIn.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      var n=null;try{n=clean(JSON.parse(rd.result))}catch(e){}
      if(!n){flash('불러오기 실패: 형식이 달라요');return}
      if(!confirm('현재 내용을 불러온 파일로 덮어쓸까요?'))return;
      S=n;save();render();flash('불러왔어요');
    };
    rd.readAsText(f);
  };
  document.getElementById('bHtml').onclick=function(){
    var VX='.photo{cursor:default}.photo:hover::after{display:none}.gname{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}.cname{flex:1;font-size:18px;font-weight:800}.ptxt{flex:1;min-height:120px;max-height:420px;overflow:auto;border-left:4px solid var(--blue);background:var(--soft);padding:14px 16px;font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word}@media(max-width:640px){.gname{font-size:22px}}';
    var json=JSON.stringify({mode:S.mode,guilds:S.guilds}).replace(/</g,'\\u003c');
    var html='<!doctype html>\n<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>길드 캐릭터 카드</title>'+
      '<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">'+
      '<style>'+document.getElementById('css').textContent+VX+'</style></head><body data-mode="'+S.mode+'">'+
      '<div class="top"><div class="brand"><b>GUILD</b> CARDS</div><button class="sw" id="sw" role="switch" aria-checked="false" aria-label="OFF / ON 전환"><span class="l a">OFF</span><span class="l b">ON</span><span class="k" id="k">OFF</span></button></div>'+
      '<main class="wrap" id="root"></main>'+
      '<script type="application/json" id="d">'+json+'<\/script>'+
      '<script>'+document.getElementById('v-js').textContent+'<\/script></body></html>';
    saveFile('guild-cards.html',html);
  };

  render();
})();
</script>
</body>
</html>
